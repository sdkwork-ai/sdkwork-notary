[package]
rust-version.workspace = true
name = "sdkwork-notary-embedded-bootstrap"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Embedded notary application bootstrap for platform runtime consumers."


[lints]
workspace = true
[lib]
name = "sdkwork_notary_embedded_bootstrap"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
axum.workspace = true
dotenvy = "0.15"
sdkwork-contract-service = { workspace = true }
sdkwork-merchandise-repository-sqlx = { workspace = true }
sdkwork-merchandise-service = { workspace = true }
sdkwork-order-repository-sqlx = { workspace = true }
sdkwork-order-service = { workspace = true }
sdkwork-database-config.workspace = true
sdkwork-database-id.workspace = true
sdkwork-database-sqlx.workspace = true
sdkwork-drive-workspace-service = { workspace = true }
sdkwork-notary-case-contract.workspace = true
sdkwork-notary-case-repository-sqlx.workspace = true
sdkwork-notary-case-service.workspace = true
sdkwork-notary-database-host.workspace = true
sdkwork-routes-notary-app-api.workspace = true
sdkwork-routes-notary-backend-api.workspace = true
sdkwork-utils-rust.workspace = true
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
