# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/notary/webserver.pid;
error_log /var/log/sdkwork/notary/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name notary-dev.sdkwork.com notary-dev.birdcoder.com notary-dev.dtupay.com notary-dev.noaper.com notary-dev.sdkwork.cn notary-dev.birdcoder.cn notary-dev.dtupay.cn notary-dev.noaper.cn notary-dev.skubc.com notary-dev.skubc.cn notary-dev.zowalk.com notary-dev.zowalk.cn notary-dev.offer86.com notary-dev.offer86.cn notary-dev.86offer.com notary-dev.86offer.cn notary-admin-dev.sdkwork.com notary-admin-dev.birdcoder.com notary-admin-dev.dtupay.com notary-admin-dev.noaper.com notary-admin-dev.sdkwork.cn notary-admin-dev.birdcoder.cn notary-admin-dev.dtupay.cn notary-admin-dev.noaper.cn notary-admin-dev.skubc.com notary-admin-dev.skubc.cn notary-admin-dev.zowalk.com notary-admin-dev.zowalk.cn notary-admin-dev.offer86.com notary-admin-dev.offer86.cn notary-admin-dev.86offer.com notary-admin-dev.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
